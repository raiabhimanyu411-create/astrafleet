name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

            set -e

            echo "Entering AstraFleet directory..."
            cd /var/www/astrafleet

            echo "Pulling latest code..."
            git pull --ff-only origin main

            echo "Installing dependencies..."
            npm install

            echo "Installing all app dependencies..."
            npm run install:all

            echo "Building application..."
            npm run build

            echo "Reloading AstraFleet..."
            pm2 reload astrafleet --update-env

            echo "Saving PM2 configuration..."
            pm2 save

            echo "Deployment completed successfully."
          EOF
